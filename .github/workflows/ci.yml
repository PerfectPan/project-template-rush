name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node common/scripts/install-run-rush.js install
      - run: npm run check
      - name: Require change files for package changes
        # The version PR consumes change files, and dependency bots cannot write them.
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'rush-release/main' &&
          !startsWith(github.head_ref, 'dependabot/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          node common/scripts/install-run-rush.js change --verify --no-fetch --target-branch "$base"
          node scripts/release-intent.ts check --base "$base"
