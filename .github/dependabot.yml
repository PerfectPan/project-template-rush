version: 2

updates:
  # Dependabot does not understand Rush: it edits package.json but not common/config/rush/pnpm-lock.yaml.
  # Before merging, push `rush update` output to the PR branch (see docs/development/release.md).
  # A vite-plus bump must also bump the @voidzero-dev/vite-plus-core override in common/config/rush/pnpm-config.json.
  - package-ecosystem: "npm"
    directories:
      - "/packages/*"
      - "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      toolchain:
        patterns:
          - "vite-plus"
          - "typescript"
          - "@types/node"
    ignore:
      # lint-config is a git dependency whose upgrades land with their code fixes; Dependabot misreads its tags
      # and proposes downgrades (v0.5.0 -> v0.3.2).
      - dependency-name: "@perfectpan/lint-config"
      # Runtime types follow the Node LTS major pinned in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
